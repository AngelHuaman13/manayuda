<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ManayudaApp</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="hero">
    <h1>Mana<span>Yuda</span></h1>
    <p>Conectamos donantes con comedores populares de Villa El Salvador.</p>
  </header>

  <main>
    <section class="card barra-sesion">
      <h2 id="saludo"></h2>
      <button type="button" id="btn-salir">Cerrar sesión</button>
    </section>

    <section class="card" id="seccion-comedor" hidden>
      <h2>Registrar mi comedor</h2>
      <form id="form-comedor">
        <label>Nombre del comedor
          <input type="text" id="com-nombre" maxlength="120" required>
        </label>
        <label>Dirección
          <input type="text" id="com-direccion" maxlength="200" required>
        </label>
        <div class="fila">
          <label>Distrito
            <input type="text" id="com-distrito" maxlength="80" value="Villa El Salvador" required>
          </label>
          <label>Teléfono (opcional)
            <input type="tel" id="com-telefono" maxlength="20">
          </label>
        </div>
        <label>Personas que atiende
          <input type="number" id="com-personas" min="0" value="0">
        </label>
        <button type="submit">Registrar comedor</button>
        <p id="mensaje-comedor" role="status"></p>
      </form>
    </section>

    <section class="card" id="seccion-donacion" hidden>
      <h2>Registrar donación</h2>
      <form id="form-donacion">
        <label>Producto
          <input type="text" id="producto" maxlength="120" required>
        </label>
        <div class="fila">
          <label>Cantidad
            <input type="number" id="cantidad" step="0.01" min="0.01" required>
          </label>
          <label>Unidad
            <select id="unidad">
              <option>kg</option>
              <option>litros</option>
              <option>unidades</option>
            </select>
          </label>
        </div>
        <label>Fecha de vencimiento (opcional)
          <input type="date" id="fechaVencimiento">
        </label>
        <button type="submit">Donar</button>
        <p id="mensaje" role="status"></p>
      </form>
    </section>

    <section class="card">
      <h2>Donaciones disponibles</h2>
      <ul id="lista-donaciones" class="lista"></ul>
    </section>

    <section class="card">
      <h2>Asignar donación a un comedor</h2>
      <form id="form-entrega">
        <label>Donación
          <select id="entrega-donacion" required></select>
        </label>
        <label>Comedor
          <select id="entrega-comedor" required></select>
        </label>
        <label>Cantidad a entregar
          <input type="number" id="entrega-cantidad" step="0.01" min="0.01" required>
        </label>
        <label>Observaciones (opcional)
          <input type="text" id="entrega-obs" maxlength="255">
        </label>
        <button type="submit">Registrar entrega</button>
        <p id="mensaje-entrega" role="status"></p>
      </form>
    </section>

    <section class="card">
      <h2>Entregas realizadas</h2>
      <ul id="lista-entregas" class="lista"></ul>
    </section>

    <section class="card">
      <h2>Comedores populares</h2>
      <ul id="lista-comedores" class="lista"></ul>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
